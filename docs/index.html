<meta charset="UTF-8">

<title>My Learn</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px;
  }
  header { padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header .meta { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border); overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .tabs::-webkit-scrollbar { height: 4px; }
  .tabs::-webkit-scrollbar-track { background: transparent; }
  .tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .tabs::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  .tab {
    padding: 8px 16px; cursor: pointer; border: none; background: none;
    color: var(--text-dim); font-size: 13px; font-weight: 500;
    white-space: nowrap; border-bottom: 2px solid transparent;
    font-family: inherit; transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge {
    font-size: 11px; margin-left: 4px; color: var(--text-dim);
  }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .content { display: none; }
  .content.active { display: block; }

  .progress-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
  }
  .progress-section .label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; margin-bottom: 6px;
  }
  .progress-section .pct { font-weight: 600; font-size: 16px; color: var(--accent); }
  .progress-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-bar .fill { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.3s; }

  .group { margin-bottom: 18px; }
  .group-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
  }

  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 5px; font-size: 13px;
    transition: background 0.1s;
  }
  .row:hover { background: var(--surface); }

  .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .dot.done { background: var(--green); }
  .dot.todo { background: var(--border); }

  .name { flex: 1; }
  .name.done { color: var(--green); }

  .mastery-bar {
    display: flex; gap: 3px; align-items: center; flex-shrink: 0;
  }
  .mastery-bar .cell {
    width: 10px; height: 10px; border-radius: 2px;
    background: #484f58;
  }
  .pill-wait {
    font-size: 10px; color: #d2991d;
    border: 1px solid #d2991d; border-radius: 4px;
    padding: 0 4px; margin-left: 6px;
    vertical-align: middle; white-space: nowrap; flex-shrink: 0;
  }

  .btn {
    font-size: 11px; padding: 2px 8px; border: 1px solid var(--border);
    border-radius: 3px; background: var(--surface); color: var(--text-dim);
    cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0;
    opacity: 0; transition: opacity 0.15s;
  }
  .row:hover .btn { opacity: 1; }
  @media (hover: none) { .btn { opacity: 0.6; } }
  .btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 2px; }

  .review-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px; font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .review-item:last-child { border-bottom: none; }
  .review-item .chap { font-weight: 500; min-width: 100px; }
  .review-item .gap { color: var(--text-dim); font-size: 12px; flex: 1; }
  .review-item .btn { opacity: 1; }

  /* Expandable plan */
  .row { cursor: pointer; }
  .plan-detail {
    display: none;
    padding: 8px 12px 12px 32px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.8;
    border-left: 2px solid var(--border);
    margin-left: 13px;
    margin-bottom: 6px;
  }
  .plan-detail.open { display: block; }
  .plan-detail .section-label {
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .plan-detail .merge-note {
    color: var(--text-dim);
    font-style: italic;
    padding: 4px 0;
  }
  .plan-detail a { color: var(--accent); text-decoration: none; }
  .plan-detail a:hover { text-decoration: underline; }

  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--green); color: #fff; padding: 6px 14px;
    border-radius: 5px; font-size: 12px; opacity: 0;
    transform: translateY(8px); transition: all 0.2s; pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>

// Compute phase stats
function stats(phase) {
  let total = 0, done = 0;
  for (const g of phase.groups)
    for (const c of g.chapters) {
      const p = DATA.plans[c.name];
      if (p && p.m) continue; // skip merged
      total++; if (c.done) done++;
    }
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}

// Toast
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

let ctimer = null;
function copy(text, btn) {
  if (!navigator.clipboard) { toast('不支持剪贴板'); return; }
  clearTimeout(ctimer);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓'; toast('已复制: ' + text);
    ctimer = setTimeout(() => btn.textContent = '复制', 1500);
  }).catch(() => toast('复制失败'));
}

function togglePlan(row) {
  const detail = row.nextElementSibling;
  if (detail && detail.classList.contains('plan-detail')) {
    detail.classList.toggle('open');
  }
}

// Build tabs + panels
const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');
const tabDefs = [
  ...DATA.phases.map(p => ({ id: p.id, name: p.name, badge: (s => `${s.done}/${s.total}`)(stats(p)) })),
  { id: 'memory', name: '记忆', badge: String(DATA.memory.length) }
];

let html = '';
tabDefs.forEach((t, i) => {
  tabs.innerHTML += `<button class="tab${i===0?' active':''}" data-id="${t.id}" role="tab" aria-selected="${i===0}">${t.name} <span class="badge">${t.badge}</span></button>`;
});

// Render phase panels
for (const p of DATA.phases) {
  const s = stats(p);
  html += `<div class="content${p.id==='p1'?' active':''}" id="panel-${p.id}">
    <div class="progress-section">
      <div class="label"><span>${s.done} / ${s.total} 已完成</span><span class="pct">${s.pct}%</span></div>
      <div class="progress-bar"><div class="fill" style="width:${s.pct}%"></div></div>
    </div>`;
  for (const g of p.groups) {
    html += `<div class="group"><div class="group-title">${g.name}</div>`;
    for (const c of g.chapters) {
      const cmd = c.done ? `复习 ${c.id} ${c.name}` : `讲 ${c.id} ${c.name}`;
      const plan = DATA.plans[c.name];
      const hasPlan = plan && (plan.o || plan.m);
      const m = c.mastery || 0;
      const fillColors = ['', '#f85149', '#d2991d', '#a3e635', '#3fb950'];
      let cells = '';
      for (let i = 0; i < 4; i++) {
        if (i < m) cells += '<span class="cell" style="background:' + fillColors[m] + '"></span>';
        else cells += '<span class="cell"></span>';
      }
      // Merge note row
      if (plan && plan.m) continue;
      const pending = (c.note && c.note.indexOf('作业待验收') >= 0) ? '<span class="pill-wait">作业待验收</span>' : '';
      html += `<div class="row" data-chapter="${c.name}" onclick="togglePlan(this)">
        <span class="name ${c.done?'done':''}">${c.name}${pending}</span>
        <span class="mastery-bar" title="熟练度 ${m}/4">${cells}</span>
        <button class="btn" onclick="event.stopPropagation();copy('${cmd}',this)" aria-label="${cmd}">复制</button>
      </div>`;
      if (hasPlan) {
        html += `<div class="plan-detail"><span class="section-label">📋 学习目标 · ${plan.s}课时${plan.n?` · ${plan.n}`:''}</span><br>`;
        for (const o of plan.o) html += `• ${o}<br>`;
        html += `<br><span class="section-label">🏋 练习</span><br>${plan.e}<br>`;
        html += `<br><span class="section-label">📚 来源</span><br>`;
        for (const r of plan.r) html += `<a href="${r.startsWith('http')?r:'https://'+r}" target="_blank">${r}</a><br>`;
        html += `</div>`;
      }
    }
    html += '</div>';
  }
  html += '</div>';
}

// Memory panel
html += `<div class="content" id="panel-memory">`;
if (DATA.memory.length === 0) {
  html += `<div class="progress-section"><div class="label">
    <span>暂无诊断记录</span>
    <span style="font-size:13px;color:var(--text-dim)">开启新 Phase 前我会出评估题，结果写在这里，决定哪些跳过、哪些深讲</span>
  </div></div>`;
} else {
  for (const m of DATA.memory) {
    html += `<div class="progress-section">
      <div class="label"><span>${m.phase} · ${m.date} · ${m.summary}</span></div>`;
    for (const item of m.items) {
      const lvlLabel = item.level >= 3 ? '强' : item.level >= 2 ? '中' : item.level >= 1 ? '弱' : '未接触';
      const lvlColor = item.level >= 3 ? 'var(--green)' : item.level >= 2 ? 'var(--accent)' : item.level >= 1 ? '#d2991d' : 'var(--text-dim)';
      html += `<div class="row">
        <span class="name">${item.area}</span>
        <span style="font-size:11px;color:${lvlColor};flex-shrink:0">${lvlLabel}</span>
        ${item.note ? `<span style="font-size:11px;color:var(--text-dim);flex:1;text-align:right">${item.note}</span>` : ''}
      </div>`;
    }
    html += '</div>';
  }
}
html += '</div>';

panels.innerHTML = html;

// Tab switching
tabs.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  tab.classList.add('active'); tab.setAttribute('aria-selected','true');
  document.getElementById('panel-'+tab.dataset.id).classList.add('active');
});

tabs.addEventListener('keydown', e => {
  const all = [...tabs.querySelectorAll('.tab')];
  const idx = all.indexOf(document.activeElement);
  if (idx===-1) return;
  if (e.key==='ArrowRight') { e.preventDefault(); all[(idx+1)%all.length].click(); }
  if (e.key==='ArrowLeft') { e.preventDefault(); all[(idx-1+all.length)%all.length].click(); }
});
</script>
