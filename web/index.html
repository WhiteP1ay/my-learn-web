<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Learn — AI 全栈学习进度</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d2991d;
    --red: #f85149;
    --purple: #a371f7;
    --orange: #f0883e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    max-width: 960px;
    margin: 0 auto;
    padding: 20px;
  }
  header {
    padding: 24px 0 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  header h1 { font-size: 22px; font-weight: 600; }
  header .meta { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

  /* Phase Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    font-family: inherit;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge {
    display: inline-block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 11px;
    margin-left: 6px;
    color: var(--text-dim);
  }

  /* Phase Content */
  .phase-content { display: none; }
  .phase-content.active { display: block; }

  /* Progress Bar */
  .progress-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .progress-section .label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .progress-section .label .pct { font-weight: 600; font-size: 18px; color: var(--accent); }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
  .fill.green { background: var(--green); }
  .fill.yellow { background: var(--yellow); }
  .fill.red { background: var(--red); }

  /* Groups */
  .group {
    margin-bottom: 20px;
  }
  .group-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* Chapter rows */
  .chapter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    transition: background 0.1s;
  }
  .chapter-row:hover { background: var(--surface); }

  .mastery-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .mastery-dot.m4 { background: var(--green); }
  .mastery-dot.m3 { background: var(--accent); }
  .mastery-dot.m2 { background: var(--yellow); }
  .mastery-dot.m1 { background: var(--orange); }
  .mastery-dot.m0 { background: var(--border); }

  .chapter-name { flex: 1; }
  .chapter-name.reviewable { color: var(--accent); cursor: pointer; }
  .chapter-name.reviewable:hover { text-decoration: underline; }

  .strategy-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tag-completed { background: rgba(63,185,80,0.15); color: var(--green); }
  .tag-comprehensive { background: rgba(139,148,158,0.1); color: var(--text-dim); }
  .tag-in_progress { background: rgba(210,153,29,0.15); color: var(--yellow); }
  .tag-next_up { background: rgba(88,166,255,0.15); color: var(--accent); }
  .tag-in_project { background: rgba(163,113,247,0.15); color: var(--purple); }
  .tag-deferred { background: rgba(240,136,62,0.08); color: var(--orange); font-style: italic; }
  .tag-optional { background: rgba(139,148,158,0.05); color: var(--text-dim); font-style: italic; }
  .tag-fast_track { background: rgba(163,113,247,0.1); color: var(--purple); }

  /* Copy button */
  .copy-btn {
    font-size: 11px;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .chapter-row:hover .copy-btn { opacity: 1; }
  @media (hover: none) { .copy-btn { opacity: 0.6; } }
  .copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .copy-btn:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy-btn.copied { background: var(--green); color: #fff; border-color: var(--green); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* Sections */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 24px;
  }
  .section h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }

  /* Review Pool */
  .review-item {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    align-items: flex-start;
  }
  .review-item:last-child { border-bottom: none; }
  .review-item .chapter { font-weight: 500; min-width: 140px; flex-shrink: 0; }
  .review-item .info { color: var(--text-dim); flex: 1; }
  .review-item .info .gap { color: var(--orange); font-size: 12px; margin-top: 2px; }

  /* Upcoming */
  .upcoming { color: var(--accent); font-size: 14px; line-height: 2; }

  /* Copy toast */
  .toast {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    right: 20px;
    background: var(--green);
    color: #fff;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* Tooltip for note */
  .note-hint { color: var(--text-dim); font-size: 10px; margin-left: 4px; }
</style>
</head>

// ============================================================
//  RENDER
// ============================================================
const EL = {
  meta: document.getElementById('meta-info'),
  tabs: document.getElementById('tabs'),
  content: document.getElementById('phase-content'),
  review: document.getElementById('review-pool'),
  upcoming: document.getElementById('upcoming-plan'),
  parking: document.getElementById('parking-lot'),
  toast: document.getElementById('toast')
};

function toast(msg) {
  EL.toast.textContent = msg;
  EL.toast.classList.add('show');
  setTimeout(() => EL.toast.classList.remove('show'), 1500);
}

let copyTimer = null;
function copyToClipboard(text, btn) {
  if (!navigator.clipboard) {
    toast('复制失败：浏览器不支持 Clipboard API');
    return;
  }
  clearTimeout(copyTimer);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    toast('已复制: ' + text);
    copyTimer = setTimeout(() => {
      btn.textContent = '复制命令';
      btn.classList.remove('copied');
    }, 1500);
  }).catch(() => {
    toast('复制失败，请手动选择文本');
  });
}

// Strategy → tag CSS class
function tagClass(s) {
  const m = {
    completed: 'tag-completed',
    comprehensive: 'tag-comprehensive',
    in_progress: 'tag-in_progress',
    next_up: 'tag-next_up',
    in_project: 'tag-in_project',
    deferred: 'tag-deferred',
    optional: 'tag-optional',
    fast_track: 'tag-fast_track'
  };
  return m[s] || 'tag-comprehensive';
}

// Mastery → dot CSS class
function dotClass(m) {
  if (m >= 4) return 'm4';
  if (m === 3) return 'm3';
  if (m === 2) return 'm2';
  if (m === 1) return 'm1';
  return 'm0';
}

// Strategy → display label
function strategyLabel(s) {
  const labels = {
    completed: '✓ 已完成',
    comprehensive: '待学习',
    in_progress: '进行中',
    next_up: '▶ 下一篇',
    in_project: '项目中学',
    deferred: '后置',
    optional: '选学',
    fast_track: '可快进'
  };
  return labels[s] || s;
}

// Compute phase stats
function phaseStats(phase) {
  let total = 0, completed = 0, inProgress = 0;
  for (const g of phase.groups) {
    for (const c of g.chapters) {
      if (c.strategy === 'deferred') continue;
      total++;
      if (c.mastery >= 4) completed++;
      else if (c.mastery >= 3) completed++;
      if (c.mastery >= 1 && c.mastery < 3) inProgress++;
    }
  }
  const mastered = completed;
  const pct = total ? Math.round((mastered / total) * 100) : 0;
  return { total, mastered, inProgress, pct };
}

// Render tabs
function renderTabs() {
  EL.tabs.setAttribute('role', 'tablist');
  EL.tabs.setAttribute('aria-label', '学习阶段');
  EL.tabs.innerHTML = CURRICULUM.phases.map((p, i) => {
    const s = phaseStats(p);
    return `<button class="tab${i === 0 ? ' active' : ''}" data-phase="${p.id}"
      role="tab" aria-selected="${i === 0}" aria-controls="phase-${p.id}" id="tab-${p.id}">
      ${p.name.split(':')[0]}
      <span class="badge">${s.mastered}/${s.total}</span>
    </button>`;
  }).join('');
}

// Render a single phase
function renderPhase(phase) {
  const s = phaseStats(phase);
  const pctClass = s.pct >= 70 ? 'green' : s.pct >= 30 ? 'yellow' : 'red';

  let html = `<div class="progress-section">
    <div class="label">
      <span>${s.mastered} / ${s.total} 章已掌握${s.inProgress ? '（' + s.inProgress + ' 进行中）' : ''}</span>
      <span class="pct">${s.pct}%</span>
    </div>
    <div class="progress-bar"><div class="fill ${pctClass}" style="width:${s.pct}%"></div></div>
  </div>`;

  for (const g of phase.groups) {
    html += `<div class="group"><div class="group-title">${g.name}</div>`;
    for (const c of g.chapters) {
      // Determine if reviewable (mastery >= 3 in review_pool)
      const inPool = STATE.review_pool.find(r => r.chapter_id === c.id);
      const reviewable = inPool && c.mastery >= 3;
      const chClass = reviewable ? 'chapter-name reviewable' : 'chapter-name';

      // Copy command based on strategy
      let copyCmd = '';
      if (c.strategy === 'next_up') {
        copyCmd = '继续学习';
      } else if (c.strategy === 'comprehensive' || c.strategy === 'fast_track') {
        copyCmd = `讲 ${g.name} - ${c.name}`;
      } else if (c.strategy === 'in_project' || c.strategy === 'in_progress') {
        copyCmd = `讲 ${c.name}`;
      } else if (reviewable) {
        copyCmd = `复习 ${c.name}`;
      } else if (c.strategy === 'completed') {
        copyCmd = `复习 ${c.name}`;
      }

      const note = c.note ? `<span class="note-hint">${c.note}</span>` : '';

      html += `<div class="chapter-row" data-id="${c.id}">
        <span class="mastery-dot ${dotClass(c.mastery)}" title="掌握度 ${c.mastery}/4"></span>
        <span class="${chClass}">${c.name}${note}</span>
        <span class="strategy-tag ${tagClass(c.strategy)}">${strategyLabel(c.strategy)}</span>
        ${copyCmd ? `<button class="copy-btn" onclick="event.stopPropagation();copyToClipboard('${copyCmd.replace(/'/g, "\\'")}', this)" aria-label="复制命令: ${copyCmd}">复制命令</button>` : ''}
      </div>`;
    }
    html += '</div>';
  }

  return html;
}

// Render review pool
function renderReview() {
  if (!STATE.review_pool.length) {
    EL.review.innerHTML = '<div style="color:var(--text-dim)">暂无待复习章节</div>';
    return;
  }
  EL.review.innerHTML = STATE.review_pool.map(r => {
    const cmd = `复习 ${r.chapter_name}`;
    return `<div class="review-item">
      <div class="chapter">${r.chapter_name}</div>
      <div class="info">
        掌握 ${r.mastery}/${r.max_mastery} · 上次 ${r.last_review}
        ${r.gap ? `<div class="gap">Gap: ${r.gap}</div>` : ''}
        ${r.note ? `<div style="color:var(--text-dim);font-size:12px">${r.note}</div>` : ''}
      </div>
      <button class="copy-btn" style="opacity:1;align-self:center" onclick="copyToClipboard('${cmd}', this)">复制命令</button>
    </div>`;
  }).join('');
}

// Render upcoming plan
function renderPlan() {
  EL.upcoming.innerHTML = STATE.upcoming_plan.map(p =>
    `<div>→ ${p}</div>`
  ).join('');
}

// Render parking lot
function renderParking() {
  EL.parking.innerHTML = STATE.parking_lot.map(p =>
    `<div class="review-item">
      <div class="chapter">${p.chapter}</div>
      <div class="info">${p.trigger}</div>
    </div>`
  ).join('');
}

// Meta info
function renderMeta() {
  const m = CURRICULUM.meta;
  EL.meta.innerHTML = `📍 ${m.current_position} · Session ${m.session_count} · ${m.last_session} · 项目: ${m.project_spine}`;
}

// Init
renderTabs();
renderMeta();

// Render phase content as separate divs
let phaseHTML = '';
for (const p of CURRICULUM.phases) {
  phaseHTML += `<div class="phase-content${p.id === 'phase1' ? ' active' : ''}" id="phase-${p.id}">${renderPhase(p)}</div>`;
}
EL.content.innerHTML = phaseHTML;

renderReview();
renderPlan();
renderParking();

// Tab switching — click + keyboard
function activateTab(phaseId) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-selected', 'false');
  });
  document.querySelectorAll('.phase-content').forEach(p => p.classList.remove('active'));
  const tab = document.getElementById(`tab-${phaseId}`);
  const content = document.getElementById(`phase-${phaseId}`);
  if (tab) { tab.classList.add('active'); tab.setAttribute('aria-selected', 'true'); }
  if (content) content.classList.add('active');
}

EL.tabs.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activateTab(tab.dataset.phase);
});

EL.tabs.addEventListener('keydown', e => {
  const tabs = [...EL.tabs.querySelectorAll('.tab')];
  const idx = tabs.indexOf(document.activeElement);
  if (idx === -1) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    const next = tabs[(idx + 1) % tabs.length];
    next.focus();
    activateTab(next.dataset.phase);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = tabs[(idx - 1 + tabs.length) % tabs.length];
    prev.focus();
    activateTab(prev.dataset.phase);
  }
});
</script>
